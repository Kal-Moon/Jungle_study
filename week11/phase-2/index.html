<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 리액트</title>
    <link rel="stylesheet" href="src/styles/base.css">
    <link rel="stylesheet" href="src/demos/phase_one/styles.css">
    <link rel="stylesheet" href="src/demos/phase_two/styles.css">
  </head>
  <body>
    <main class="phase-one">
      <div class="history-controls">
        <button type="button" id="back-button" data-action="back">← 뒤로가기</button>
        <button type="button" id="forward-button" data-action="forward">앞으로가기 →</button>
        <button type="button" id="patch-button" data-action="patch">Patch</button>
        <span id="history-position"></span>
      </div>
      <p id="error-message" role="alert"></p>

      <section class="area-panel">
        <h2>실제 영역</h2>
        <div id="real-area"></div>
      </section>

      <section class="area-panel">
        <h2>테스트 영역</h2>
        <p class="edit-guide">
          글자를 고치거나, 줄을 추가·삭제하거나, 굵게(Ctrl+B) 등 서식을 바꾼 뒤 Patch를 누르세요.
          속성(class 등)은 직접 편집할 수 없고, 가장 바깥 상자를 지우면 비교할 수 없어요.
        </p>
        <div id="test-area" contenteditable="true"></div>
      </section>
    </main>

    <section class="phase-two">
      <h1 class="phase-heading">Phase 2 : 함수형 컴포넌트와 Hooks</h1>
      <p class="phase-guide">
        할 일을 입력하고 Enter 또는 추가를 누르세요. Esc를 누르면 입력 중인 글자가 지워집니다.
      </p>
      <div id="phase-two-root"></div>
    </section>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
